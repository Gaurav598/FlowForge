services:
  mongo:
    image: mongo:7
    container_name: flowforge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowforge-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/flowforge
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-compose-access-secret-change-me
      JWT_REFRESH_SECRET: local-compose-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      COOKIE_DOMAIN: localhost
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowforge-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  redis-data:
